<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Ilustrație House Mirror — casă modulară cu fațadă oglindă în pădure">
  <defs>
    <linearGradient id="sky-m" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbe9e3"/>
      <stop offset="1" stop-color="#f2efe7"/>
    </linearGradient>
    <linearGradient id="mirror-m" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9d4c9"/>
      <stop offset="0.5" stop-color="#8fb8a8"/>
      <stop offset="1" stop-color="#5d8a78"/>
    </linearGradient>
    <linearGradient id="ground-m" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9c0a8"/>
      <stop offset="1" stop-color="#b3a98e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="560" fill="url(#sky-m)"/>
  <!-- forest backdrop -->
  <g fill="#7a9c8b" opacity="0.55">
    <polygon points="60,380 100,240 140,380"/>
    <polygon points="130,380 175,210 220,380"/>
    <polygon points="620,380 665,220 710,380"/>
    <polygon points="690,380 730,260 770,380"/>
    <polygon points="10,380 40,290 70,380"/>
  </g>
  <g fill="#5d8a78" opacity="0.75">
    <polygon points="95,380 140,230 185,380"/>
    <polygon points="655,380 700,240 745,380"/>
  </g>
  <rect y="380" width="800" height="180" fill="url(#ground-m)"/>
  <!-- house body -->
  <g>
    <rect x="230" y="220" width="340" height="170" fill="url(#mirror-m)"/>
    <!-- mirrored panel seams -->
    <g stroke="#f2efe7" stroke-width="3" opacity="0.7">
      <line x1="315" y1="220" x2="315" y2="390"/>
      <line x1="400" y1="220" x2="400" y2="390"/>
      <line x1="485" y1="220" x2="485" y2="390"/>
    </g>
    <!-- reflections of trees on facade -->
    <g fill="#e8f1ec" opacity="0.45">
      <polygon points="250,390 275,300 300,390"/>
      <polygon points="430,390 455,290 480,390"/>
      <polygon points="520,390 542,310 564,390"/>
    </g>
    <!-- roof line -->
    <rect x="222" y="208" width="356" height="14" rx="4" fill="#2b3a35"/>
    <!-- door -->
    <rect x="388" y="300" width="46" height="90" rx="2" fill="#2b3a35"/>
    <circle cx="425" cy="348" r="3.4" fill="#d8cfb8"/>
    <!-- deck -->
    <rect x="210" y="390" width="380" height="12" rx="3" fill="#8a7f66"/>
  </g>
  <!-- sun -->
  <circle cx="675" cy="105" r="38" fill="#e9dcbe" opacity="0.9"/>
  <!-- foreground shrubs -->
  <g fill="#6e9483" opacity="0.8">
    <ellipse cx="165" cy="440" rx="46" ry="18"/>
    <ellipse cx="640" cy="455" rx="58" ry="20"/>
    <ellipse cx="90" cy="470" rx="36" ry="14"/>
  </g>
</svg>
