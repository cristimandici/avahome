<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Ilustrație House Boat — casă modulară plutitoare pe apă">
  <defs>
    <linearGradient id="sky-b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfe8ea"/>
      <stop offset="1" stop-color="#f4f0e6"/>
    </linearGradient>
    <linearGradient id="water-b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9dbfc4"/>
      <stop offset="1" stop-color="#6f9ba3"/>
    </linearGradient>
    <linearGradient id="wood-b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c49a"/>
      <stop offset="1" stop-color="#c0a97e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="560" fill="url(#sky-b)"/>
  <!-- distant shore -->
  <g fill="#8aa898" opacity="0.5">
    <ellipse cx="120" cy="330" rx="150" ry="26"/>
    <ellipse cx="700" cy="325" rx="170" ry="30"/>
  </g>
  <g fill="#7a9c8b" opacity="0.6">
    <polygon points="60,330 85,265 110,330"/>
    <polygon points="650,325 678,250 706,325"/>
    <polygon points="710,325 735,270 760,325"/>
  </g>
  <!-- water -->
  <rect y="340" width="800" height="220" fill="url(#water-b)"/>
  <!-- pontoon -->
  <rect x="230" y="392" width="360" height="26" rx="10" fill="#3d4a50"/>
  <!-- house body -->
  <g>
    <rect x="258" y="248" width="304" height="144" fill="url(#wood-b)"/>
    <!-- wood siding lines -->
    <g stroke="#a8916a" stroke-width="2" opacity="0.6">
      <line x1="258" y1="272" x2="562" y2="272"/>
      <line x1="258" y1="296" x2="562" y2="296"/>
      <line x1="258" y1="320" x2="562" y2="320"/>
      <line x1="258" y1="344" x2="562" y2="344"/>
      <line x1="258" y1="368" x2="562" y2="368"/>
    </g>
    <!-- flat roof with overhang -->
    <rect x="246" y="234" width="328" height="16" rx="5" fill="#2b3a35"/>
    <!-- big window -->
    <rect x="282" y="272" width="110" height="96" rx="4" fill="#bfd8d2"/>
    <g stroke="#f2efe7" stroke-width="3">
      <line x1="337" y1="272" x2="337" y2="368"/>
    </g>
    <!-- door -->
    <rect x="470" y="288" width="48" height="104" rx="3" fill="#2b3a35"/>
    <circle cx="508" cy="342" r="3.4" fill="#d8cfb8"/>
    <!-- railing on deck -->
    <g stroke="#2b3a35" stroke-width="3">
      <line x1="238" y1="360" x2="238" y2="392"/>
      <line x1="582" y1="360" x2="582" y2="392"/>
      <line x1="232" y1="360" x2="588" y2="360"/>
    </g>
  </g>
  <!-- reflection -->
  <g opacity="0.25">
    <rect x="258" y="424" width="304" height="70" fill="#d8c49a" transform="skewX(-2)"/>
  </g>
  <!-- ripples -->
  <g stroke="#eef4f2" stroke-width="3" stroke-linecap="round" opacity="0.6" fill="none">
    <path d="M120 450 q 20 -8 40 0 t 40 0"/>
    <path d="M600 470 q 22 -8 44 0 t 44 0"/>
    <path d="M300 510 q 24 -9 48 0 t 48 0"/>
    <path d="M180 490 q 18 -7 36 0"/>
  </g>
  <!-- sun -->
  <circle cx="130" cy="100" r="36" fill="#e9dcbe" opacity="0.9"/>
  <!-- birds -->
  <g stroke="#5a6b66" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M560 120 q 8 -8 16 0 q 8 -8 16 0"/>
    <path d="M620 96 q 7 -7 14 0 q 7 -7 14 0"/>
  </g>
</svg>
